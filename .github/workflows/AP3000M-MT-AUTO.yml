# 定时自动编译：Auto-Clean 清理完成后同时构建 AP3000M 的两种 MT 配置
# （原 AP3000M-AUTO，重命名并改为 MT5700 / MT5700M 双矩阵并行）
#   MT5700  —— 仅 luci-app-mt5700
#   MT5700M —— luci-app-mt5700m + sms-tool_q + ubus-at-daemon
# 产物文件名与 Release Tag 均嵌入 MT 模式，可并存区分。
# 注意：MT5700M 变体自 2026-10-07 起暂时禁用（不稳定），当前仅编译 MT5700。
name: AP3000M 定时编译（MT 双配置）

on:
  # 2026-10-18 起关闭定时触发：本机型不在当前使用范围内，不再随「自动清理」
  # 每日自动编译（仅保留下方手动入口）。需要恢复时把 workflow_run 段取消注释即可。
  # workflow_run:
  #   workflows: ["自动清理"]
  #   types:
  #     - completed
  # 也可手动触发
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动追加插件包（多行请用换行隔开）'
        required: false
        type: string

permissions: write-all

jobs:
  config:
    name: ${{ matrix.CONFIG }}（${{ matrix.MT_MODE }} 方案）
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [AP3000M]
        # 本机型源码取自 ImmortalWrt 官方 25.12 正式版（tag v25.12.2）。
        # 2026-10-18 起由 VIKINGYFY/immortalwrt 的 owrt 快照分支切回官方稳定版：
        # 该机型的 DTS 与 filogic.mk 设备定义在官方 v25.12.2 中与 fork 逐字节一致，
        # 已无跟随个人 fork 的必要（详见 CHANGELOG 2026-10-18）。
        SOURCE: [immortalwrt/immortalwrt]
        BRANCH: [v25.12.2]
        # 同时编译两种 MT 配置（严格互斥，由 Apply/VerifyMTMode 保证）
        # MT5700M 变体不稳定，自 2026-10-07 起暂时禁用，当前仅编译 MT5700
        MT_MODE: [MT5700]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{ matrix.CONFIG }}

      WRT_THEME: aurora

      WRT_REPO: https://github.com/${{ matrix.SOURCE }}.git
      WRT_BRANCH: ${{ matrix.BRANCH }}
      WRT_SOURCE: ${{ matrix.SOURCE }}

      WRT_PACKAGE: ${{ inputs.PACKAGE }}
      WRT_TEST: 'false'
      MT_MODE: ${{ matrix.MT_MODE }}
